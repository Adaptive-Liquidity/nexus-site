<svg aria-labelledby="trustTitle" height="900" id="trustSvg" role="img" viewbox="0 0 1200 675" width="1600" xmlns="http://www.w3.org/2000/svg"><defs><style>text{shape-rendering:geometricPrecision}</style><pattern height="24" id="microgrid" patternunits="userSpaceOnUse" width="24"><path d="M24 0H0V24" fill="none" stroke="#f6f1e7" stroke-opacity=".045"/></pattern><marker id="arrow" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0 0L8 4L0 8Z" fill="#b8b3a8"/></marker></defs><title id="trustTitle">Nested trust boundaries and adversarial paths</title><rect fill="url(#microgrid)" height="675" width="1200"/>
<g transform="translate(125 70)"><rect fill="#111820" height="520" rx="30" stroke="#b96464" stroke-opacity=".38" width="950"/><text fill="#b96464" font-family="monospace" font-size="11" letter-spacing="2" x="30" y="42">EXTERNAL SYSTEMS + IRREVERSIBLE EFFECTS</text><rect fill="#121a20" height="385" rx="26" stroke="#d4a55f" stroke-opacity=".42" width="760" x="95" y="75"/><text fill="#d4a55f" font-family="monospace" font-size="11" letter-spacing="2" x="125" y="113">HOST OS · OPERATORS · KEY CUSTODY</text><rect fill="#102028" height="250" rx="22" stroke="#5f93a8" stroke-opacity=".58" width="570" x="190" y="145"/><text fill="#5f93a8" font-family="monospace" font-size="11" letter-spacing="2" x="220" y="182">NEXUS RUNTIME BOUNDARY</text><rect fill="#0b1014" height="115" rx="18" stroke="#75a184" stroke-opacity=".7" width="380" x="285" y="215"/><text fill="#75a184" font-family="monospace" font-size="11" letter-spacing="2" x="315" y="250">WASM GUEST + CAPABILITY-GATED WASI</text><path d="M330 285H620" stroke="#f6f1e7" stroke-opacity=".18"/><text fill="#b8b3a8" font-size="11" x="330" y="308">sandboxed execution state · snapshot / rollback</text></g>
<g id="threatPaths"><path d="M80 337H410" data-threat-path="token" marker-end="url(#arrow)" stroke="#b96464" stroke-width="4"/><g data-threat-path="token"><path d="M395 320l30 34M425 320l-30 34" stroke="#b96464" stroke-width="4"/><text fill="#f0b1b1" font-family="monospace" font-size="10" x="85" y="315">EXPIRED / REVOKED TOKEN</text><text fill="#75a184" font-family="monospace" font-size="10" x="438" y="350">DENIED AT AUTHORITY CHECK</text></g>
<g data-threat-path="memory" opacity="0"><path d="M80 210H380V265H410" fill="none" marker-end="url(#arrow)" stroke="#b96464" stroke-width="4"/><path d="M395 248l30 34M425 248l-30 34" stroke="#b96464" stroke-width="4"/><text fill="#f0b1b1" font-family="monospace" font-size="10" x="85" y="190">FORGED MEMORY CONTEXT</text><text fill="#d4a55f" font-family="monospace" font-size="10" x="440" y="265">MODE DEGRADES / AUTHORITY UNCHANGED</text></g>
<g data-threat-path="external" opacity="0"><path d="M600 337H1120" marker-end="url(#arrow)" stroke="#b96464" stroke-width="4"/><text fill="#f0b1b1" font-family="monospace" font-size="10" x="770" y="315">EFFECT ESCAPES BEFORE ABORT</text><text fill="#b96464" font-family="monospace" font-size="10" x="780" y="365">DIRECT ROLLBACK NOT ESTABLISHED · COMPENSATION TARGET</text></g>
<g data-threat-path="host" opacity="0"><path d="M1075 110C950 150 930 245 885 340" fill="none" marker-end="url(#arrow)" stroke="#b96464" stroke-width="4"/><text fill="#f0b1b1" font-family="monospace" font-size="10" x="900" y="90">COMPROMISED HOST / KEY CUSTODY</text><text fill="#b96464" font-family="monospace" font-size="10" x="770" y="420">RESIDUAL TRUST · OUTSIDE CAPSULE’S GUARANTEE</text></g></g>
<g transform="translate(75 550)"><rect fill="#111820" height="80" rx="12" stroke="#f6f1e7" stroke-opacity=".14" width="1050"/><text fill="#f6f1e7" font-family="serif" font-size="20" id="trustResult" x="25" y="32">Enforced: expired authority is denied before the host call.</text><text fill="#b8b3a8" font-size="12" id="trustDetail" x="25" y="57">The denial and capability mismatch can be emitted as evidence; this does not prove the host itself is uncompromised.</text></g>
</svg>