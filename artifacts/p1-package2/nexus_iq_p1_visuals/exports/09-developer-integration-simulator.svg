<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
    <title id="title">Developer Integration Simulator</title><desc id="desc">Simulate representative integration paths while separating current APIs, in-integration composition, and target architecture.</desc><defs>
