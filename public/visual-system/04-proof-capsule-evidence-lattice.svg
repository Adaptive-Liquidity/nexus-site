<svg aria-labelledby="evTitle" height="900" id="evidenceSvg" role="img" viewbox="0 0 1200 675" width="1600" xmlns="http://www.w3.org/2000/svg"><title id="evTitle">Proof Capsule field binding lattice</title><defs><style>text{shape-rendering:geometricPrecision}</style><filter id="papershadow"><fedropshadow dx="0" dy="14" flood-color="#594f3f" flood-opacity=".17" stddeviation="12"/></filter></defs><rect fill="#eee7d8" height="675" width="1200"/><g opacity=".16"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200" stroke="#1a1f24"/><path d="M100 0V675M300 0V675M500 0V675M700 0V675M900 0V675M1100 0V675" stroke="#1a1f24"/></g>
<g filter="url(#papershadow)"><rect fill="#f8f3e8" height="495" rx="18" stroke="#1a1f24" stroke-opacity=".22" width="420" x="390" y="90"/><rect fill="#e2d8c6" height="62" rx="18" width="420" x="390" y="90"/><path d="M390 152H810" stroke="#1a1f24" stroke-opacity=".18"/><text fill="#1a1f24" font-family="monospace" font-size="13" letter-spacing="2" x="425" y="126">PROOF CAPSULE · V1</text><text fill="#4a5560" font-family="monospace" font-size="9" x="748" y="126">STRUCTURED RECORD</text>
<g id="recordFields"><rect data-record="subject" fill="#fff" fill-opacity=".45" height="56" rx="8" stroke="#2f5e73" width="350" x="425" y="180"/><rect data-record="authority" fill="#fff" fill-opacity=".45" height="56" rx="8" stroke="#1a1f24" stroke-opacity=".2" width="350" x="425" y="250"/><rect data-record="state" fill="#fff" fill-opacity=".45" height="56" rx="8" stroke="#1a1f24" stroke-opacity=".2" width="350" x="425" y="320"/><rect data-record="failure" fill="#fff" fill-opacity=".45" height="56" rx="8" stroke="#1a1f24" stroke-opacity=".2" width="350" x="425" y="390"/><rect data-record="limits" fill="#fff" fill-opacity=".45" height="88" rx="8" stroke="#1a1f24" stroke-opacity=".2" width="215" x="425" y="460"/><rect data-record="signature" fill="#fff" fill-opacity=".45" height="88" rx="8" stroke="#1a1f24" stroke-opacity=".2" width="123" x="652" y="460"/></g>
<g fill="#1a1f24" font-family="monospace" font-size="10"><text x="445" y="203">subject + tool + input digest</text><text fill="#4a5560" x="445" y="222">what ran · against what input</text><text x="445" y="273">capabilities + policy mode</text><text fill="#4a5560" x="445" y="292">required · granted · mismatch</text><text x="445" y="343">snapshot + execution state</text><text fill="#4a5560" x="445" y="362">pre-state identifier · recovery source</text><text x="445" y="413">failure + rollback</text><text fill="#4a5560" x="445" y="432">classification · occurred · restored</text><text x="445" y="485">limitations[]</text><text fill="#4a5560" x="445" y="505">mandatory</text><text fill="#4a5560" x="445" y="525">non-dismissible</text><text x="670" y="485">signature</text><text fill="#4a5560" x="670" y="505">optional</text><text fill="#4a5560" x="670" y="525">trust-bound</text></g></g>
<!-- evidence sources -->
<g font-family="monospace" font-size="10" id="fieldNodes"><g data-node="subject"><rect fill="#e3edf1" height="70" rx="10" stroke="#2f5e73" width="220" x="70" y="145"/><text fill="#1a1f24" x="90" y="174">OBSERVED EXECUTION</text><text fill="#4a5560" x="90" y="194">module · tool · duration · digests</text><path d="M290 180H425" stroke="#2f5e73" stroke-width="2"/></g><g data-node="authority" opacity=".45"><rect fill="#ece5d8" height="70" rx="10" stroke="#1a1f24" stroke-opacity=".25" width="220" x="70" y="260"/><text fill="#1a1f24" x="90" y="289">AUTHORITY CONTEXT</text><text fill="#4a5560" x="90" y="309">tokens · attenuation · denial</text><path d="M290 295H425" stroke="#1a1f24" stroke-opacity=".35"/></g><g data-node="state" opacity=".45"><rect fill="#ece5d8" height="70" rx="10" stroke="#1a1f24" stroke-opacity=".25" width="220" x="70" y="375"/><text fill="#1a1f24" x="90" y="404">STATE CONTEXT</text><text fill="#4a5560" x="90" y="424">snapshot · branch · memory mode</text><path d="M290 410H425" stroke="#1a1f24" stroke-opacity=".35"/></g><g data-node="failure" opacity=".45"><rect fill="#ece5d8" height="70" rx="10" stroke="#1a1f24" stroke-opacity=".25" width="220" x="910" y="165"/><text fill="#1a1f24" x="930" y="194">RECOVERY EVIDENCE</text><text fill="#4a5560" x="930" y="214">failure class · rollback source</text><path d="M810 418H865V200H910" fill="none" stroke="#1a1f24" stroke-opacity=".35"/></g><g data-node="limits" opacity=".45"><rect fill="#f0ded8" height="90" rx="10" stroke="#7a3e3e" stroke-opacity=".45" width="220" x="910" y="300"/><text fill="#1a1f24" x="930" y="329">NEGATIVE CLAIM BOUNDARY</text><text fill="#7a3e3e" x="930" y="349">what the record does not establish</text><text fill="#4a5560" x="930" y="369">always attached to interpretation</text><path d="M640 504H860V345H910" fill="none" stroke="#7a3e3e" stroke-opacity=".6"/></g><g data-node="signature" opacity=".45"><rect fill="#e7e3d6" height="70" rx="10" stroke="#496f59" stroke-opacity=".55" width="220" x="910" y="465"/><text fill="#1a1f24" x="930" y="494">INTEGRITY BINDING</text><text fill="#4a5560" x="930" y="514">signer · algorithm · trust anchor</text><path d="M775 504H910" stroke="#496f59" stroke-opacity=".65"/></g></g>
<text fill="#1a1f24" font-family="serif" font-size="24" id="evidenceTitle" x="70" y="595">Subject: bind the record to the observed execution.</text><text fill="#4a5560" font-size="13" id="evidenceBody" x="70" y="624">This establishes which tool/module and input digest the runtime says it observed—not that the program’s result was correct.</text>
</svg>