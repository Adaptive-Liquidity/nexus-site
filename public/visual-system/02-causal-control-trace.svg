<svg aria-labelledby="traceTitle" height="900" id="traceSvg" role="img" viewbox="0 0 1200 675" width="1600" xmlns="http://www.w3.org/2000/svg"><title id="traceTitle">Comparison of uncontrolled agent execution and Nexus-IQ controlled execution</title><defs><style>text{shape-rendering:geometricPrecision}</style><lineargradient id="cone" x1="0" x2="1"><stop stop-color="#7a3e3e" stop-opacity=".42"/><stop offset="1" stop-color="#7a3e3e" stop-opacity="0"/></lineargradient><marker id="arrow" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0 0L8 4L0 8Z" fill="#b8b3a8"/></marker><pattern height="24" id="microgrid" patternunits="userSpaceOnUse" width="24"><path d="M24 0H0V24" fill="none" stroke="#f6f1e7" stroke-opacity=".045"/></pattern></defs><rect fill="url(#microgrid)" height="675" width="1200"/>
<text fill="#b8b3a8" font-family="monospace" font-size="12" letter-spacing="2" x="60" y="80">WITHOUT A COMMIT BOUNDARY</text><text fill="#b8b3a8" font-family="monospace" font-size="12" letter-spacing="2" x="60" y="370">WITH NEXUS-IQ</text>
