<svg aria-labelledby="heroTitle heroDesc" height="900" id="heroSvg" role="img" viewbox="0 0 1200 675" width="1600" xmlns="http://www.w3.org/2000/svg">
<title id="heroTitle">Cognitive Hypervisor product mechanism</title><desc id="heroDesc">Agent intent enters a staged execution boundary, authority is bound, validators evaluate the proposed change, the action commits or aborts, and a Proof Capsule is emitted.</desc>
<defs><style>.phase-group{opacity:1}.flow{stroke-dasharray:5 8}.intent-packet{transform:translateX(0)} text{shape-rendering:geometricPrecision}</style>
<lineargradient id="glass" x1="0" x2="1"><stop stop-color="#cbe8f2" stop-opacity=".08"/><stop offset=".5" stop-color="#83b4c6" stop-opacity=".32"/><stop offset="1" stop-color="#13222a" stop-opacity=".08"/></lineargradient>
<lineargradient id="beam" x1="0" x2="1"><stop stop-color="#f6f1e7" stop-opacity="0"/><stop offset=".45" stop-color="#f6f1e7"/><stop offset="1" stop-color="#5f93a8"/></lineargradient>
<filter height="200%" id="softGlow" width="200%" x="-50%" y="-50%"><fegaussianblur result="b" stddeviation="4"/><femerge><femergenode in="b"/><femergenode in="SourceGraphic"/></femerge></filter>
<pattern height="24" id="microgrid" patternunits="userSpaceOnUse" width="24"><path d="M24 0H0V24" fill="none" stroke="#f6f1e7" stroke-opacity=".045"/></pattern>
<pattern height="36" id="lattice" patternunits="userSpaceOnUse" width="36"><path d="M18 0L36 9V27L18 36L0 27V9Z" fill="none" stroke="#5f93a8" stroke-opacity=".19"/></pattern>
</defs>
<rect fill="url(#microgrid)" height="675" width="1200"/>
<g opacity=".5"><path d="M55 105H1145M55 570H1145" stroke="#f6f1e7" stroke-opacity=".12"/><path d="M600 55V620" stroke="#f6f1e7" stroke-opacity=".06"/></g>
<!-- intent -->
<g class="phase-group is-active" data-group="intent"><text fill="#7a7670" font-family="monospace" font-size="11" letter-spacing="2" x="65" y="130">DECLARED INTENT</text><path d="M70 250C135 250 145 310 215 310M70 310H215M70 370C135 370 145 310 215 310" fill="none" stroke="#f6f1e7" stroke-opacity=".38" stroke-width="1.5"/><g class="intent-packet" id="intentPacket"><rect fill="#111820" height="64" rx="8" stroke="#f6f1e7" stroke-opacity=".55" width="92" x="212" y="278"/><path d="M228 296h60M228 309h45M228 322h52" stroke="#f6f1e7" stroke-opacity=".48"/><circle cx="288" cy="296" fill="#d4a55f" r="3"/></g><text fill="#b8b3a8" font-size="13" x="68" y="425">Scope + requested effect</text><text fill="#7a7670" font-size="11" x="68" y="447">No authority implied</text></g>
<!-- throughline -->
<path d="M305 310H930" stroke="#f6f1e7" stroke-opacity=".12" stroke-width="8"/><path class="flow" d="M305 310H930" fill="none" stroke="url(#beam)" stroke-width="2"/>
<!-- stage -->
<g class="phase-group" data-group="stage"><text fill="#7a7670" font-family="monospace" font-size="11" letter-spacing="2" x="345" y="130">STAGED STATE</text><rect fill="url(#glass)" height="250" rx="12" stroke="#5f93a8" stroke-opacity=".62" width="120" x="340" y="190"/><rect fill="#111820" height="70" rx="7" stroke="#f6f1e7" stroke-opacity=".3" width="80" x="360" y="225"/><rect fill="none" height="70" rx="7" stroke="#5f93a8" stroke-dasharray="4 5" stroke-opacity=".62" width="80" x="368" y="233"/><path d="M376 326h48M376 340h58M376 354h38" stroke="#b8b3a8" stroke-opacity=".48"/><path d="M400 205v-25M400 450v25" stroke="#5f93a8" stroke-opacity=".5"/><text fill="#b8b3a8" font-size="11" x="358" y="410">snapshot S₀</text></g>
<!-- authority -->
<g class="phase-group" data-group="constrain"><text fill="#7a7670" font-family="monospace" font-size="11" letter-spacing="2" x="495" y="130">AUTHORITY PLANE</text><rect fill="url(#lattice)" height="290" rx="12" stroke="#5f93a8" stroke-opacity=".72" width="132" x="500" y="170"/><path d="M520 310H612" stroke="#f6f1e7" stroke-opacity=".45"/><path d="M536 230l28-16 28 16v32l-28 16-28-16z" fill="#2f5e73" fill-opacity=".18" stroke="#5f93a8"/><path d="M550 246l9 9 19-23" fill="none" stroke="#75a184" stroke-width="3"/><g fill="#f6f1e7"><circle cx="522" cy="380" r="3"/><circle cx="560" cy="395" r="3"/><circle cx="604" cy="372" r="3"/></g><path d="M522 380L560 395L604 372" fill="none" stroke="#f6f1e7" stroke-opacity=".35"/><text fill="#b8b3a8" font-size="11" x="517" y="428">attenuate, never widen</text></g>
<!-- validation -->
<g class="phase-group" data-group="validate"><text fill="#7a7670" font-family="monospace" font-size="11" letter-spacing="2" x="665" y="130">VALIDATION ARRAY</text><rect fill="#111820" height="270" rx="12" stroke="#a9793b" stroke-opacity=".55" width="130" x="670" y="185"/><g transform="translate(690 220)"><rect fill="#1a252d" height="38" rx="6" stroke="#f6f1e7" stroke-opacity=".17" width="90"/><rect fill="#1a252d" height="38" rx="6" stroke="#f6f1e7" stroke-opacity=".17" width="90" y="52"/><rect fill="#1a252d" height="38" rx="6" stroke="#f6f1e7" stroke-opacity=".17" width="90" y="104"/><rect fill="#1a252d" height="38" rx="6" stroke="#f6f1e7" stroke-opacity=".17" width="90" y="156"/><g fill="#d4a55f"><circle cx="15" cy="19" r="4"/><circle cx="15" cy="71" r="4"/><circle cx="15" cy="123" r="4"/><circle cx="15" cy="175" r="4"/></g><g stroke="#b8b3a8" stroke-opacity=".45"><path d="M28 19h47"/><path d="M28 71h47"/><path d="M28 123h47"/><path d="M28 175h47"/></g></g></g>
<!-- decision -->
<g class="phase-group" data-group="commit"><text fill="#7a7670" font-family="monospace" font-size="11" letter-spacing="2" x="835" y="130">CONTROLLED DECISION</text><path d="M800 310H850C885 310 885 250 925 250H1000" fill="none" stroke="#75a184" stroke-width="4"/><path class="flow" d="M800 310H850C885 310 885 250 925 250H1000" fill="none" stroke="#c8e2cf" stroke-width="1.5"/><rect fill="#13201a" height="64" rx="8" stroke="#75a184" width="106" x="1000" y="218"/><text fill="#e8f0eb" font-family="monospace" font-size="12" x="1021" y="246">COMMIT</text><text fill="#75a184" font-size="10" x="1017" y="264">effects applied</text></g>
<g class="phase-group" data-group="abort"><path d="M800 310H850C885 310 885 390 925 390H1000" fill="none" stroke="#b96464" stroke-width="4"/><path class="flow" d="M800 310H850C885 310 885 390 925 390H1000" fill="none" stroke="#f0b1b1" stroke-width="1.5"/><rect fill="#231111" height="64" rx="8" stroke="#b96464" width="106" x="1000" y="358"/><text fill="#f5eaea" font-family="monospace" font-size="12" x="1024" y="386">ABORT</text><text fill="#b96464" font-size="10" x="1013" y="404">restore S₀</text><path d="M1000 410C950 500 430 510 400 440" fill="none" stroke="#b96464" stroke-dasharray="5 7" stroke-opacity=".45"/></g>
<!-- distributed cognition -->
<g opacity=".8"><ellipse class="drift" cx="625" cy="310" fill="none" rx="350" ry="210" stroke="#5f93a8" stroke-dasharray="4 12" stroke-opacity=".12"/><ellipse class="drift" cx="625" cy="310" fill="none" rx="300" ry="175" stroke="#f6f1e7" stroke-dasharray="2 16" stroke-opacity=".08" style="animation-direction:reverse;animation-duration:11s"/><g fill="#5f93a8"><circle cx="410" cy="168" r="3"/><circle cx="545" cy="490" r="3"/><circle cx="720" cy="145" r="3"/><circle cx="875" cy="470" r="3"/></g><path d="M410 168L545 490L720 145L875 470" fill="none" stroke="#5f93a8" stroke-opacity=".14"/></g>
<!-- evidence -->
<g class="phase-group" data-group="emit"><text fill="#7a7670" font-family="monospace" font-size="11" letter-spacing="2" x="970" y="510">EVIDENCE EMISSION</text><path d="M1053 282V500M1053 422V500" stroke="#d4a55f" stroke-opacity=".7"/><g transform="translate(968 518)"><rect fill="#eee7d8" height="98" rx="10" stroke="#fff" stroke-opacity=".5" width="170"/><path d="M18 28h90M18 42h130M18 56h112M18 70h80" stroke="#4a5560" stroke-opacity=".55"/><rect fill="none" height="28" rx="4" stroke="#2f5e73" width="28" x="122" y="18"/><path d="M128 32l6 6 11-14" fill="none" stroke="#496f59" stroke-width="2"/><text fill="#4a5560" font-family="monospace" font-size="8" x="18" y="88">limitations[] · signature · digests</text></g></g>
<g><text fill="#f6f1e7" font-family="serif" font-size="25" id="heroPhaseTitle" x="65" y="595">Intent is declared—not authorized.</text><text fill="#b8b3a8" font-size="13" id="heroPhaseBody" x="65" y="623">The action enters as scope and requested effect. No side effect has crossed the boundary.</text></g>
</svg>